# Хуки noctalia (подхватываются из любого *.toml в ~/.config/noctalia/).
[hooks]
# На экране блокировки всегда начинаем с US на ВСЕХ клавиатурах (индекс 0 в kb_layout = "us,ru"),
# иначе пароль может уйти русскими буквами, если раскладки устройств рассинхронизированы.
session_locked = "hyprctl switchxkblayout all 0"
